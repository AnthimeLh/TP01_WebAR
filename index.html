<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>TP01 - Exercice 2 - AR.js + marqueur Hiro</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!--
    embedded : la scène s'intègre dans la page au lieu de prendre tout l'écran en mode VR
    arjs : active AR.js, sourceType webcam = on utilise la caméra du téléphone/PC
    vr-mode-ui désactivé : on n'a pas besoin du bouton "casque VR"
  -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <!-- Tout ce qui est dans ce marker n'apparaît que si la caméra voit le motif Hiro -->
    <a-marker preset="hiro">
      <a-box
        position="0 0.5 0"
        color="#3B7CFF"
        material="opacity: 0.6; transparent: true;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      </a-box>
    </a-marker>

    <!-- La "caméra" AR : elle ne se positionne pas manuellement, AR.js la pilote -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
