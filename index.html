<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>TP01 - Exercice 2 - AR.js + marqueur Hiro</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!--
    embedded : la scène s'intègre dans la page au lieu de prendre tout l'écran en mode VR
    arjs : active AR.js, sourceType webcam = on utilise la caméra du téléphone/PC
    vr-mode-ui désactivé : on n'a pas besoin du bouton "casque VR"
  -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <!-- Tout ce qui est dans ce marker n'apparaît que si la caméra voit le motif Hiro -->
    <a-marker preset="hiro" id="hiroMarker">
      <a-box
        id="arBox"
        position="0 0.5 0"
        color="#3B7CFF"
        material="opacity: 0.6; transparent: true;"
        animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      </a-box>
    </a-marker>

    <!-- Marker personnalisé : le .patt généré doit être présent dans /markers/ -->
    <a-marker type="pattern" url="markers/custom.patt">
      <a-sphere
        position="0 0.5 0"
        radius="0.5"
        color="#FFD23B"
        animation="property: position; to: 0 0.8 0; dir: alternate; loop: true; dur: 1000; easing: easeInOutSine">
      </a-sphere>
    </a-marker>

    <!-- La "caméra" AR, avec un curseur au centre de l'écran pour détecter les clics/taps -->
    <a-entity camera>
      <a-cursor
        fuse="false"
        color="#FFFFFF"
        raycaster="objects: #arBox">
      </a-cursor>
    </a-entity>

  </a-scene>

  <!-- Exercice 6 : UI DOM overlay, visible seulement quand le marqueur Hiro est détecté -->
  <div id="uiOverlay" style="display: none; position: fixed; bottom: 20px; left: 0; right: 0; z-index: 999; font-family: sans-serif; justify-content: center;">
    <div style="background: rgba(0, 0, 0, 0.6); padding: 14px 18px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <label style="color: #fff; font-size: 14px;">
        Taille : <input type="range" id="sizeSlider" min="0.1" max="3.0" step="0.1" value="1">
      </label>
      <div style="display: flex; gap: 12px;">
        <button class="color-btn" data-color="#FF3B3B" style="width: 32px; height: 32px; border-radius: 50%; background: #FF3B3B; border: 2px solid #fff; padding: 0;"></button>
        <button class="color-btn" data-color="#3BFF6E" style="width: 32px; height: 32px; border-radius: 50%; background: #3BFF6E; border: 2px solid #fff; padding: 0;"></button>
        <button class="color-btn" data-color="#3B7CFF" style="width: 32px; height: 32px; border-radius: 50%; background: #3B7CFF; border: 2px solid #fff; padding: 0;"></button>
      </div>
    </div>
  </div>

  <script>
    // On attend que la page soit chargée pour être sûr que les éléments existent
    window.addEventListener('load', function () {
      const box = document.querySelector('#arBox');
      const marker = document.querySelector('#hiroMarker');
      const overlay = document.querySelector('#uiOverlay');
      const slider = document.querySelector('#sizeSlider');
      const colors = ['#3B7CFF', '#FF3B3B', '#3BFF6E', '#FFD23B'];
      let colorIndex = 0;
      let currentScale = parseFloat(slider.value);

      // L'UI n'apparaît que lorsque le marqueur Hiro est détecté par la caméra
      marker.addEventListener('markerFound', function () {
        overlay.style.display = 'flex';
      });
      marker.addEventListener('markerLost', function () {
        overlay.style.display = 'none';
      });

      // Slider : change la taille de la boîte en temps réel (0.1 -> 3.0)
      slider.addEventListener('input', function () {
        currentScale = parseFloat(slider.value);
        box.setAttribute('scale', currentScale + ' ' + currentScale + ' ' + currentScale);
      });

      // Palette de couleurs : change la couleur de la boîte immédiatement
      document.querySelectorAll('.color-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          box.setAttribute('color', btn.getAttribute('data-color'));
        });
      });

      box.addEventListener('click', function () {
        // 1. Changement de couleur : on passe à la couleur suivante dans la liste
        colorIndex = (colorIndex + 1) % colors.length;
        box.setAttribute('color', colors[colorIndex]);

        // 2. Animation supplémentaire : la boîte tourne plus vite pendant 1 seconde
        box.setAttribute('animation__spin', 'dur', 800);
        setTimeout(function () {
          box.setAttribute('animation__spin', 'dur', 4000);
        }, 1000);

        // 3. Petit effet d'échelle (pulse) au clic, autour de la taille actuelle du slider
        const s = currentScale;
        box.setAttribute('animation__scale', {
          property: 'scale',
          from: s + ' ' + s + ' ' + s,
          to: (s * 1.3) + ' ' + (s * 1.3) + ' ' + (s * 1.3),
          dir: 'alternate',
          dur: 200,
          loop: 2
        });
      });
    });
  </script>

</body>
</html>
