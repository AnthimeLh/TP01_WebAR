<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TP01 - Exercice 1 - Scène 3D A-Frame</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene background="color: #ECECEC">

    <!-- Le plan qui sert de sol -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#7BC8A4">
    </a-plane>

    <!-- Boîte 1 : rouge -->
    <a-box
      position="-3 2 -2"
      color="#FF3B3B"
      width="1" height="1" depth="1">
    </a-box>

    <!-- Boîte 2 : verte -->
    <a-box
      position="0 2 -4"
      color="#3BFF6E"
      width="1" height="1" depth="1">
    </a-box>

    <!-- Boîte 3 : bleue -->
    <a-box
      position="3 2 -2"
      color="#3B7CFF"
      width="1" height="1" depth="1">
    </a-box>

    <!-- Lumières -->
    <a-entity light="type: ambient; color: #BBB"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-1 2 1"></a-entity>

    <!-- Caméra : hauteur 10, distance 15, orientée vers le centre du plan -->
    <a-entity
      camera
      position="0 10 15"
      rotation="-33.7 0 0">
    </a-entity>

  </a-scene>

</body>
</html>
